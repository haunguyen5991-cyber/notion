<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tìm kiếm tài sản</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--surface:#f9f8f7;--ink:#2c2c2b;--muted:#62615d;--line:#d4d3d0;--accent:#1c68b8;--hover:#edf5fc}
*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:100%;max-width:none;height:100dvh;margin:0;padding:4px;display:flex;flex-direction:column;min-height:0}.topbar{display:flex;align-items:center;gap:8px;padding-right:40px;flex:none}.topbar form{flex:1;min-width:0}.home{flex:none;min-width:44px;min-height:46px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;white-space:nowrap;color:var(--muted)}.home svg{width:18px;height:18px;flex:none}form{flex:none}label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.box{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;min-height:46px;padding:0 2px 0 12px;background:var(--bg)}.box:focus-within{outline:2px solid var(--accent);outline-offset:2px}.glass{width:18px;height:18px;flex:none;color:var(--muted)}input{font:inherit;min-width:0;flex:1;border:0;outline:0!important;color:var(--ink);background:transparent;height:44px;padding:8px 0}input::placeholder{color:var(--muted);opacity:1}input::-webkit-search-cancel-button{display:none}button{font:inherit;border:0;background:transparent;color:var(--muted);cursor:pointer;width:44px;height:44px;border-radius:6px;font-size:24px;flex:none}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}button:hover{background:var(--surface)}button[hidden]{display:none}#clear{margin-right:0}.note{display:none}main:has(#results:not(:empty)) .note{display:none}.status{font-size:14px;color:var(--muted);margin:8px 0 6px;flex:none}.status:empty{display:none}ul{padding:0;margin:0;list-style:none;min-height:0;flex:0 1 auto;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;border-radius:6px}ul:not(:empty){border:0}li+li{border-top:1px solid var(--line)}a{display:flex;align-items:center;gap:8px;padding:8px;min-height:44px;text-decoration:none;color:var(--ink)}a:hover{background:var(--hover)}.copy{min-width:0;flex:1;overflow:hidden}.title{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:14px;line-height:20px;color:var(--muted);flex:none;white-space:nowrap}.arrow{flex:none;color:var(--muted);font-size:16px}.empty{padding:12px;background:var(--surface);border-radius:8px;font-size:14px;color:var(--muted);overflow:auto}.empty[hidden]{display:none}@media(min-width:441px){input{font-size:14px}}@media(max-width:440px){.home-label{display:none}.home{justify-content:center;padding:0;width:44px}main{padding:4px}.box{gap:8px;padding-left:10px}}@media(prefers-color-scheme:dark){:root{--bg:#191919;--surface:#252525;--ink:#f2f2f0;--muted:#b6b5b1;--line:#575754;--accent:#70b6ff;--hover:#233548}}
</style>
</head>
<body><main>
<div class="topbar"><form id="searchForm" role="search" autocomplete="off">
<label for="query">Tìm tài sản</label>
<div class="box"><svg class="glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="query" type="search" maxlength="100" placeholder="Địa chỉ, tên đường hoặc quận…" aria-describedby="help status" aria-controls="results" spellcheck="false"><button id="clear" type="button" aria-label="Xóa từ khóa" hidden>×</button></div>
</form><a class="home" href="https://dulieunhapho.com/" target="_blank" rel="noopener noreferrer" aria-label="Mở trang chủ Dữ Liệu Nhà Phố" title="Trang chủ Dữ Liệu Nhà Phố"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v11h14V9M9 20v-7h6v7"/></svg><span class="home-label">Trang chủ</span></a></div>
<p id="help" class="note">Chọn kết quả để mở hồ sơ gốc.</p>
<p id="status" class="status" role="status" aria-live="polite"></p>
<ul id="results" aria-label="Kết quả tìm kiếm"></ul>
<div id="empty" class="empty" hidden></div>
</main>
<script>
'use strict';
const input=document.getElementById('query'),clear=document.getElementById('clear'),list=document.getElementById('results'),status=document.getElementById('status'),empty=document.getElementById('empty');
let timer,controller,sequence=0;
function reset(){sequence++;controller?.abort();clearTimeout(timer);list.replaceChildren();empty.hidden=true;status.textContent='';list.removeAttribute('aria-busy')}
function errorState(text){list.replaceChildren();empty.textContent=text;empty.hidden=false;status.textContent=''}
function allowedUrl(value){try{const u=new URL(value),h=u.hostname;return u.protocol==='https:'&&!u.username&&!u.password&&(h==='notion.so'||h==='app.notion.com'||h==='notion.site'||h.endsWith('.notion.site')||h==='dulieunhapho.com'||h==='www.dulieunhapho.com')?u.href:null}catch{return null}}
async function search(){
  const q=input.value.trim(),featured=!q;if(q && q.length<2)return;
  const current=++sequence;controller?.abort();controller=new AbortController();const activeController=controller;
  status.textContent=featured?'Đang tải…':'Đang tìm…';list.setAttribute('aria-busy','true');empty.hidden=true;
  // Do not leave results for an old query clickable while a new query loads.
  list.replaceChildren();
  const timeout=setTimeout(()=>activeController.abort(),45000);
  try{
    const response=await fetch(featured?'/api/featured':'/api/search?q='+encodeURIComponent(q),{signal:activeController.signal,cache:'no-store',credentials:'omit'});
    const data=await response.json();if(current!==sequence)return;
    if(!response.ok)throw new Error(response.status===429?'Bạn tìm quá nhanh. Vui lòng thử lại sau ít phút.':'Chưa thể tải kết quả. Vui lòng thử lại sau.');
    if(!Array.isArray(data.items))throw new Error('Chưa thể tải kết quả. Vui lòng thử lại sau.');
    const fragment=document.createDocumentFragment();
    for(const item of data.items){
      const url=allowedUrl(item.url);if(!url||typeof item.title!=='string')continue;
      const li=document.createElement('li'),a=document.createElement('a'),copy=document.createElement('span'),title=document.createElement('span'),meta=document.createElement('span'),arrow=document.createElement('span');
      a.href=url;a.target='_blank';a.rel='noopener noreferrer';copy.className='copy';title.className='title';title.style.display='block';title.textContent=item.title;a.title=[item.title,item.district,item.status].filter(Boolean).join(' · ');meta.className='meta';meta.style.display='block';meta.textContent=item.status?'· '+item.status:'';arrow.className='arrow';arrow.textContent='↗';arrow.setAttribute('aria-hidden','true');
      copy.append(title);a.append(copy);if(meta.textContent)a.append(meta);a.append(arrow);li.append(a);fragment.append(li);
    }
    list.replaceChildren(fragment);list.setAttribute('aria-label',featured?'Tài sản ưu tiên':'Kết quả tìm kiếm');list.scrollTop=0;
    if(featured){status.textContent='';empty.hidden=true}
    else if(!list.children.length){status.textContent='Không tìm thấy tài sản phù hợp.';empty.textContent='Thử nhập số nhà, tên đường hoặc quận khác.';empty.hidden=false}
    else status.textContent='';
  }catch(error){if(current!==sequence)return;if(error.name==='AbortError')errorState('Kết nối đang chậm. Bạn thử tìm lại nhé.');else errorState(error.message||'Chưa thể tải kết quả. Vui lòng thử lại sau.')}
  finally{clearTimeout(timeout);if(current===sequence)list.removeAttribute('aria-busy')}
}
input.addEventListener('input',()=>{reset();clear.hidden=!input.value;if(input.value.trim().length>=2){status.textContent='Đang tìm…';timer=setTimeout(search,250)}else if(input.value.trim())status.textContent='Nhập ít nhất 2 ký tự.';else search()});
clear.addEventListener('click',()=>{input.value='';clear.hidden=true;reset();input.focus();search()});
input.addEventListener('keydown',event=>{if(event.key==='Escape'){clear.click();event.preventDefault()}if(event.key==='ArrowDown'){const first=list.querySelector('a');if(first){first.focus();event.preventDefault()}}});
list.addEventListener('keydown',event=>{const links=[...list.querySelectorAll('a')],i=links.indexOf(document.activeElement);if(event.key==='ArrowDown'){links[Math.min(i+1,links.length-1)]?.focus();event.preventDefault()}if(event.key==='ArrowUp'){if(i<=0)input.focus();else links[i-1]?.focus();event.preventDefault()}});
document.getElementById('searchForm').addEventListener('submit',event=>{event.preventDefault();const first=list.querySelector('a');if(first)first.click();else{clearTimeout(timer);search()}});
setInterval(()=>{if(document.visibilityState==='visible'&&(input.value.trim().length===0||input.value.trim().length>=2)&&!list.hasAttribute('aria-busy'))search()},120000);
search();
</script>
</body></html>
