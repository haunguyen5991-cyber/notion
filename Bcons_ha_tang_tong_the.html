function getPlayableVideoUrl(url) { return url.replace(/\.mov(\?.*)?$/i, '.mp4$1'); }
function updateMain(autoplay=false) {
  const item=items[currentIndex], wrap=document.getElementById('mainMediaWrap');
  wrap.querySelectorAll('video').forEach(v=>v.pause()); wrap.innerHTML='';
  if (item.youtubeId) {
    const iframe=document.createElement('iframe');
    iframe.src='https://www.youtube-nocookie.com/embed/'+item.youtubeId+'?autoplay='+(autoplay?'1':'0')+'&mute=1&playsinline=1&rel=0';
    iframe.title=item.caption; iframe.allow='autoplay; encrypted-media; picture-in-picture'; iframe.allowFullscreen=true;
    iframe.style.cssText='width:100%;height:100%;max-width:100%;max-height:100%;border:0;background:#000;';
    wrap.appendChild(iframe);
  } else {
    const video=document.createElement('video'); video.src=getPlayableVideoUrl(item.url); video.poster=item.poster; video.controls=true; video.playsInline=true; video.preload='metadata'; wrap.appendChild(video);
    if (autoplay) video.play().catch(()=>{});
  }
  const caption=document.createElement('div'); caption.className='media-caption'; caption.textContent=item.caption; wrap.appendChild(caption);
  const badge=document.createElement('div'); badge.className='group-badge'; badge.textContent=item.group; wrap.appendChild(badge);
  document.getElementById('counter').textContent=(currentIndex+1)+' / '+items.length; updateThumbs();
}
function updateThumbs() { document.querySelectorAll('.thumb').forEach((t,i)=>t.classList.toggle('active',i===currentIndex)); const a=document.querySelectorAll('.thumb')[currentIndex]; if(a) a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); }
function initThumbs() { const rail=document.getElementById('thumbRail'); items.forEach((item,i)=>{ const t=document.createElement('div'); t.className='thumb'+(i===0?' active':'')+(i===0||items[i-1].group!==item.group?' group-start':''); t.dataset.group=item.group; t.title=item.group+' · '+item.caption; t.innerHTML='<img src="'+item.poster+'" loading="lazy" alt="'+item.caption.replace(/"/g,'&quot;')+'"><span class="thumb-index">'+(i+1)+'</span><svg class="play-icon" viewBox="0 0 24 24" fill="white" style="filter:drop-shadow(0 0 2px rgba(0,0,0,.8))"><path d="M8 5v14l11-7z"/></svg>'; t.onclick=()=>{currentIndex=i;updateMain(true)}; rail.appendChild(t); }); }
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){currentIndex=(currentIndex-1+items.length)%items.length;updateMain(true)}else if(e.key==='ArrowRight'){currentIndex=(currentIndex+1)%items.length;updateMain(true)}});
initThumbs(); updateMain(false);
</script>
</body></html>
