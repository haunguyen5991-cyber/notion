<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .gallery {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fff;
  }

  /* MAIN VIEW VỚI KHOẢNG TRẮNG NGĂN CÁCH PHÍA DƯỚI */
  .main-view {
    flex: 1;
    position: relative;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .counter {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.6);
    color: white;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    z-index: 10;
  }

  #mainMediaWrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    position: relative;
  }

  #mainMediaWrap video,
  #mainMediaWrap iframe {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    min-width: 0;
    min-height: 0;
    border: 0;
    object-fit: contain;
    background: #000;
  }

  #mainMediaWrap img {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    min-width: 0;
    min-height: 0;
    object-fit: cover;
    transform-origin: center center;
    will-change: transform;
  }

  .brand-label {
    position: absolute;
    bottom: 4px;
    right: 6px;
    font-size: 10px;
    color: rgba(0,0,0,0.3);
    font-weight: 500;
    pointer-events: none;
    z-index: 10;
  }

  /* THANH CHỨA THUMBNAIL MÀU XÁM */
  .thumb-rail {
    height: 110px;
    background: #e4e4e4;
    border-top: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    overflow-x: auto;
    gap: 10px;
    padding: 10px 20px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  .thumb-rail::-webkit-scrollbar { display: none; }
  .thumb-rail { -ms-overflow-style: none; scrollbar-width: none; }

  .thumb {
    width: 88px;
    height: 88px;
    flex-shrink: 0;
    background: #222;
    border: 2px solid transparent;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border-radius: 2px;
  }

  .thumb:first-child { margin-left: auto; }
  .thumb:last-child { margin-right: auto; }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  .thumb .play-icon {
    position: absolute;
    width: 22px;
    height: 22px;
    pointer-events: none;
    z-index: 2;
  }

  .thumb.active { border-color: #000; }
  .thumb:hover { border-color: #666; }
  .blocked-media { width: 100%; height: 100%; min-height: 260px; display: grid; place-content: center; gap: 8px; padding: 24px; text-align: center; color: #f2f2f2; background: linear-gradient(135deg, #202020, #3a3a3a); }
  .blocked-media strong { font-size: 1rem; letter-spacing: .02em; }
  .blocked-media span { max-width: 280px; font-size: .82rem; line-height: 1.45; color: #c7c7c7; }
  .blocked-thumb { width: 100%; height: 100%; display: grid; place-items: center; color: #999; background: #252525; font-weight: 700; }
</style>
</head>
<body>
  <div class="gallery">
    <div class="main-view" id="mainView">
      <div class="counter" id="counter">1 / 10</div>
      <div id="mainMediaWrap"></div>
      <div class="brand-label">dulieunhapho.com</div>
    </div>
    <div class="thumb-rail" id="thumbRail"></div>
  </div>

  <script>
    const items = [
      { url: 'https://res.cloudinary.com/oy7u6ywg/image/upload/v1783675502/d47af77e-10a3-4b5b-b67c-5f2d735dce34.png', type: 'image' },
      { url: 'https://datxanh.homes/wp-content/uploads/2025/01/mat-bang-tong-nha-pho-bcons-uni.jpg', type: 'image' },
      { url: 'https://nhadatxanhmienbac.com/wp-content/uploads/2025/02/Bcons-Uni-Valley-Flycam-0602-01.jpg', type: 'image' },
      { url: 'https://youtu.be/so6p5EXxPO8', title: 'Bcons Uni Valley · Tổng thể quần thể tại phường Đông Hòa · 01', type: 'youtube' },
      { url: 'https://youtu.be/oLSc3sUG6p8', title: 'Bcons Uni Valley · Tổng thể khu phức hợp Bcons · 02', type: 'blocked', status: 'copyright-claim' },
      { url: 'https://youtu.be/k_ld0c2NVjY', title: 'Bcons Uni Valley · Đường Thống Nhất · Làng Đại Học · 03', type: 'youtube' },
      { url: 'https://youtu.be/js7pxK-BU_M', title: 'Bcons Uni Valley · Tổng quan Đông Hòa · 04', type: 'blocked', status: 'copyright-claim' }
    ];

    let currentIndex = 0;
    let isInitialLoad = true;
    function getYouTubeId(videoUrl) {
      try {
        const url = new URL(videoUrl);
        if (url.hostname === 'youtu.be') return url.pathname.slice(1);
        if (url.hostname.includes('youtube.com')) {
          return url.searchParams.get('v') || url.pathname.split('/').filter(Boolean).pop();
        }
      } catch (error) {
        console.warn('Invalid YouTube URL:', videoUrl);
      }
      return '';
    }

    function getYouTubeThumbUrl(videoUrl) {
      const id = getYouTubeId(videoUrl);
      return id ? 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg' : '';
    }

    function getYouTubeEmbedUrl(videoUrl) {
      const id = getYouTubeId(videoUrl);
      return id ? 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&mute=1&playsinline=1&controls=1&rel=0&modestbranding=1&vq=hd1080' : '';
    }

    function updateMain(shouldAutoplay = false) {

      const item = items[currentIndex];
      const wrap = document.getElementById('mainMediaWrap');
      wrap.innerHTML = '';

      if (item.type === 'youtube') {
        const iframe = document.createElement('iframe');
        iframe.src = getYouTubeEmbedUrl(item.url);
        iframe.title = item.title || 'YouTube video';
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        iframe.allowFullscreen = true;
        iframe.loading = 'eager';
        iframe.referrerPolicy = 'strict-origin-when-cross-origin';
        wrap.appendChild(iframe);
      } else if (item.type === 'blocked') {
        wrap.innerHTML = '<div class="blocked-media"><strong>' + item.title + '</strong><span>Slot được giữ nguyên; video tạm ẩn do YouTube phát hiện nội dung có bản quyền.</span></div>';
      } else {
        wrap.innerHTML = '<img src="' + item.url + '" loading="lazy">';
      }

      document.getElementById('counter').textContent = (currentIndex + 1) + ' / ' + items.length;
      updateThumbs();
    }

    function updateThumbs() {
      const rail = document.getElementById('thumbRail');
      const thumbs = document.querySelectorAll('.thumb');
      
      thumbs.forEach((t, i) => {
        t.classList.toggle('active', i === currentIndex);
      });

      if (isInitialLoad) {
        isInitialLoad = false;
        return;
      }

      const activeThumb = thumbs[currentIndex];
      if (activeThumb) {
        const railWidth = rail.clientWidth;
        const thumbLeft = activeThumb.offsetLeft;
        const thumbWidth = activeThumb.clientWidth;
        rail.scrollLeft = thumbLeft - (railWidth / 2) + (thumbWidth / 2);
      }
    }

    function initThumbs() {
      const rail = document.getElementById('thumbRail');
      items.forEach((item, idx) => {
        const t = document.createElement('div');
        t.className = 'thumb' + (idx === 0 ? ' active' : '');
        const thumbImg = item.type === 'youtube' || item.type === 'blocked'
          ? getYouTubeThumbUrl(item.url)
          : item.url;

        if (item.type === 'youtube') {
          t.innerHTML =
            '<img src="' + thumbImg + '" loading="lazy">' +
            '<svg class="play-icon" viewBox="0 0 24 24" fill="white" style="filter:drop-shadow(0 0 2px rgba(0,0,0,0.8))"><path d="M8 5v14l11-7z"/></svg>';
        } else if (item.type === 'blocked') {
          t.innerHTML = '<div class="blocked-thumb">' + (idx + 1) + '</div>';
        } else {
          t.innerHTML = '<img src="' + thumbImg + '" loading="lazy">';
        }

        t.onclick = () => { 
          currentIndex = idx; 
          updateMain(true); 
        };
        rail.appendChild(t);
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        currentIndex = (currentIndex - 1 + items.length) % items.length;
        updateMain(true);
      } else if (e.key === 'ArrowRight') {
        currentIndex = (currentIndex + 1) % items.length;
        updateMain(true);
      }
    });

    initThumbs();
    updateMain(true);
  </script>
</body>
</html>
