<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery Tiện Ích</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #fff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  .gallery {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fff;
  }

  /* MAIN VIEW VỚI KHOẢNG TRẮNG NGĂN CÁCH PHÍA DƯỚI */
  .main-view {
    flex: 1;
    position: relative;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .counter {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.6);
    color: white;
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 12px;
    z-index: 10;
  }

  #mainMediaWrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    position: relative;
    overflow: hidden;
  }

  /* ĐẢM BẢO ẢNH FULL MAIN VIEW CẢ DESKTOP & MOBILE */
  #mainMediaWrap img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    user-select: none;
    -webkit-user-drag: none;
    touch-action: pan-y;
  }

  .site-logo {
    position: absolute;
    top: 18px;
    right: 18px;
    width: clamp(95px, 13.75vw, 150px);
    height: auto;
    max-height: 150px;
    object-fit: contain;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.28));
    opacity: 0.94;
    pointer-events: none;
    z-index: 11;
  }
  
  #mainMediaWrap video,
  #mainMediaWrap iframe {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    border: 0;
    object-fit: contain;
    background: #000;
  }

  /* CHÚ THÍCH FONT CHỮ TO RÕ HÙNG DŨNG */
  .video-caption {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ffffff;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 38px;
    font-weight: 900;
    text-transform: uppercase;
    text-align: center;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 0, 0, 0.8);
    z-index: 5;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.5s ease-out;
    width: 85%;
  }

  /* THANH CHỨA THUMBNAIL */
  .thumb-rail {
    height: 110px;
    background: #e4e4e4;
    border-top: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    overflow-x: auto;
    gap: 10px;
    padding: 10px 20px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  .thumb-rail::-webkit-scrollbar { display: none; }
  .thumb-rail { -ms-overflow-style: none; scrollbar-width: none; }

  .thumb {
    width: 88px;
    height: 88px;
    flex-shrink: 0;
    background: #222;
    border: 2px solid transparent;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border-radius: 2px;
  }

  .thumb:first-child { margin-left: auto; }
  .thumb:last-child { margin-right: auto; }

  .thumb img, .thumb video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  .thumb .play-icon {
    position: absolute;
    width: 22px;
    height: 22px;
    pointer-events: none;
    z-index: 2;
  }

  .thumb.active { border-color: #000; }
  .thumb:hover { border-color: #666; }

</style>
</head>
<body>
  <div class="gallery">
    <div class="main-view" id="mainView">
      <div class="counter" id="counter">1 / 13</div>
      <img class="site-logo" src="./thien-hao-dragon-logo-shadow-2.png" alt="Thiên Hào Real Estate Intelligence">
      <div id="mainMediaWrap"></div>
    </div>
    <div class="thumb-rail" id="thumbRail"></div>
  </div>

  <script>
    const items = [
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/v1787306085/thien-hao/buv-tien-ich/buv_tien_ich_restored_01.png', title: 'Tiện ích tổng thể dự án', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/v1787306125/thien-hao/buv-tien-ich/buv_tien_ich_restored_02.png', title: 'Trung tâm thương mại hiện đại', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/v1787306131/thien-hao/buv-tien-ich/buv_tien_ich_restored_03.png', title: 'Khu vui chơi trẻ em năng động', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/v1787306140/thien-hao/buv-tien-ich/buv_tien_ich_restored_04.png', title: 'Công viên nội khu xanh mát', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/v1787306609/thien-hao/buv-tien-ich/buv_tien_ich_restored_07.png', title: 'Thực tế hạ tầng hoàn thiện', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/v1787307011/thien-hao/buv-tien-ich/buv_tien_ich_restored_08.jpg', title: 'Tuyến đường nội khu thông thoáng', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/v1787306147/thien-hao/buv-tien-ich/buv_tien_ich_restored_05.png', title: 'Hồ bơi tràn bờ chuẩn resort', type: 'image' },
      { url: 'https://res.cloudinary.com/dcspxywol/image/upload/v1787306168/thien-hao/buv-tien-ich/buv_tien_ich_restored_06.png', title: 'Trường học quốc tế nội khu', type: 'image' },
      { url: 'https://youtu.be/CQwUCVI84QQ', type: 'youtube' },
      { url: 'https://youtu.be/WJo9r6tSDTo?si=Ic_QxmnBDu5gDk1u', type: 'youtube' }
    ];

    let currentIndex = 0;
    let isInitialLoad = true;
    let captionTimeout = null;
        function getYouTubeId(videoUrl) {
      try {
        const url = new URL(videoUrl);
        if (url.hostname === 'youtu.be') return url.pathname.slice(1);
        if (url.hostname.includes('youtube.com')) {
          return url.searchParams.get('v') || url.pathname.split('/').filter(Boolean).pop();
        }
      } catch (error) {
        console.warn('Invalid YouTube URL:', videoUrl);
      }
      return '';
    }

    function getYouTubeThumbUrl(videoUrl) {
      const id = getYouTubeId(videoUrl);
      return id ? 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg' : '';
    }

    function getYouTubeEmbedUrl(videoUrl, shouldAutoplay = false) {
      const id = getYouTubeId(videoUrl);
      return id ? 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1' : '';
    }

    function updateMain(shouldAutoplay = false) {

      const item = items[currentIndex];
      const wrap = document.getElementById('mainMediaWrap');
      wrap.innerHTML = '';

      if (captionTimeout) {
        clearTimeout(captionTimeout);
      }

            if (item.type === 'video') {
        const videoEl = document.createElement('video');
        videoEl.src = item.url;
        videoEl.controls = true;
        videoEl.playsInline = true;
        videoEl.preload = 'metadata';
        wrap.appendChild(videoEl);
        if (shouldAutoplay) {
          videoEl.autoplay = true;
          videoEl.play().catch(() => {});
        }

        const captionEl = document.createElement('div');
        captionEl.className = 'video-caption';
        captionEl.textContent = item.title || '';
        wrap.appendChild(captionEl);
        
        captionTimeout = setTimeout(() => {
          captionEl.style.opacity = '0';
          setTimeout(() => captionEl.remove(), 500);
        }, 3000);
      } else if (item.type === 'youtube') {
        const iframe = document.createElement('iframe');
        iframe.src = getYouTubeEmbedUrl(item.url, shouldAutoplay);
        iframe.title = item.title || 'YouTube video';
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        iframe.allowFullscreen = true;
        iframe.loading = 'lazy';
        iframe.referrerPolicy = 'strict-origin-when-cross-origin';
        wrap.appendChild(iframe);
        const captionEl = document.createElement('div');
        captionEl.className = 'video-caption';
        captionEl.textContent = item.title || '';
        wrap.appendChild(captionEl);
        
        captionTimeout = setTimeout(() => {
          captionEl.style.opacity = '0';
          setTimeout(() => captionEl.remove(), 500);
        }, 3000);
      } else {

        const imgEl = document.createElement('img');
        imgEl.src = item.url;
        imgEl.loading = 'lazy';
        wrap.appendChild(imgEl);
        enableHorizontalDrag(imgEl, wrap);
      }

      document.getElementById('counter').textContent = (currentIndex + 1) + ' / ' + items.length;
      updateThumbs();
    }

    function enableHorizontalDrag(img, wrap) {
      let startX = 0;
      let currentX = 0;
      let dragging = false;

      const applyPan = () => {
        const limit = Math.max(90, wrap.clientWidth * 0.24);
        currentX = Math.max(-limit, Math.min(limit, currentX));
        img.style.transform = 'translateX(' + currentX + 'px)';
      };

      img.addEventListener('pointerdown', (event) => {
        dragging = true;
        startX = event.clientX - currentX;
        img.setPointerCapture(event.pointerId);
      });

      img.addEventListener('pointermove', (event) => {
        if (!dragging) return;
        currentX = event.clientX - startX;
        applyPan();
      });

      const stopDragging = (event) => {
        dragging = false;
        if (event.pointerId !== undefined && img.hasPointerCapture(event.pointerId)) {
          img.releasePointerCapture(event.pointerId);
        }
      };

      img.addEventListener('pointerup', stopDragging);
      img.addEventListener('pointercancel', stopDragging);
    }

    function updateThumbs() {
      const rail = document.getElementById('thumbRail');
      const thumbs = document.querySelectorAll('.thumb');
      
      thumbs.forEach((t, i) => {
        t.classList.toggle('active', i === currentIndex);
      });

      if (isInitialLoad) {
        isInitialLoad = false;
        return;
      }

      const activeThumb = thumbs[currentIndex];
      if (activeThumb) {
        const railWidth = rail.clientWidth;
        const thumbLeft = activeThumb.offsetLeft;
        const thumbWidth = activeThumb.clientWidth;
        rail.scrollLeft = thumbLeft - (railWidth / 2) + (thumbWidth / 2);
      }
    }

    function initThumbs() {
      const rail = document.getElementById('thumbRail');
      items.forEach((item, idx) => {
        const t = document.createElement('div');
        t.className = 'thumb' + (idx === 0 ? ' active' : '');
        
                if (item.type === 'video' || item.type === 'youtube') {
          const thumbUrl = item.type === 'youtube' ? getYouTubeThumbUrl(item.url) : item.url;
          t.innerHTML =
            '<img src="' + thumbUrl + '" loading="lazy">' +
            '<svg class="play-icon" viewBox="0 0 24 24" fill="white" style="filter:drop-shadow(0 0 2px rgba(0,0,0,0.8))"><path d="M8 5v14l11-7z"/></svg>';
        } else {

          t.innerHTML = '<img src="' + item.url + '" loading="lazy">';
        }

        t.onclick = () => { currentIndex = idx; updateMain(true); };
        rail.appendChild(t);
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        currentIndex = (currentIndex - 1 + items.length) % items.length;
        updateMain(true);
      } else if (e.key === 'ArrowRight') {
        currentIndex = (currentIndex + 1) % items.length;
        updateMain(true);
      }
    });

    initThumbs();
    updateMain(false);
  </script>
</body>
</html>
