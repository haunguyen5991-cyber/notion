<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bộ Sưu Tập Bcons</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Playfair Display', 'Lora', serif, sans-serif;
            background-color: #fcf8f2;
            color: #2c2c2c;
            overflow-x: hidden;
            position: relative;
        }

        /* Spring background motifs */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(220, 53, 69, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 50px 20px 30px;
            background: linear-gradient(135deg, #fff5f5 0%, #fff9e6 100%);
            border-bottom: 2px solid #e6d5b8;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        header h1 {
            font-size: 2.5rem;
            color: #8B0000;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header p {
            font-size: 1.1rem;
            color: #666;
            font-style: italic;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            cursor: pointer;
            background: #fff;
            aspect-ratio: 4 / 3;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            border: 1px solid #ebdccb;
        }

        .gallery-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(139, 0, 0, 0.15);
            border-color: #d4af37;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        .gallery-item::after {
            content: "🔍";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(139, 0, 0, 0.85);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .gallery-item:hover::after {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lightbox-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 2px solid #d4af37;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: -45px;
            right: 0;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            background: rgba(139, 0, 0, 0.8);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            border: 1px solid #d4af37;
        }

        .lightbox-close:hover {
            background: #8B0000;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(139, 0, 0, 0.7);
            color: white;
            border: 1px solid #d4af37;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            z-index: 1010;
        }

        .lightbox-nav:hover {
            background: #8B0000;
            transform: translateY(-50%) scale(1.1);
        }

        .lightbox-prev {
            left: 30px;
        }

        .lightbox-next {
            right: 30px;
        }

        .lightbox-counter {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: #e6d5b8;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #2c2c2c;
            color: #d4af37;
            font-size: 0.95rem;
            border-top: 1px solid #d4af37;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }
            .lightbox-nav {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
            .lightbox-prev {
                left: 10px;
            }
            .lightbox-next {
                right: 10px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 Bộ Sưu Tập Xuân Sang Trọng 🌸</h1>
        <p>Không gian nghệ thuật rực rỡ, tinh tế và đong đầy sắc xuân</p>
    </header>

    <div class="container">
        <div class="gallery-grid" id="galleryGrid">
            <!-- Images will be injected via JS -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Xuân Sang Trọng - Không Gian Trưng Bày Nghệ Thuật</p>
        <p style="margin-top: 8px; font-size: 0.85rem; color: #b89728;"><a href="https://dulieunhapho.com" target="_blank" style="color: inherit; text-decoration: none;">dulieunhapho.com</a> * @thienhao</p>
    </footer>

    <!-- Lightbox Component -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content" id="lightboxContent">
            <div class="lightbox-close" id="lightboxClose">&times;</div>
            <div class="lightbox-nav lightbox-prev" id="lightboxPrev">&#10094;</div>
            <img id="lightboxImg" src="" alt="Zoomed Image">
            <div class="lightbox-nav lightbox-next" id="lightboxNext">&#10095;</div>
            <div class="lightbox-counter" id="lightboxCounter">1 / 30</div>
        </div>
    </div>

    <script>
        const exactUrls = [
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999645/IMG_7292_rhe5jz.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999645/IMG_7290_iptskz.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999645/IMG_7288_tr1fu4.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999644/IMG_7284_f8gysy.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999644/IMG_7285_z2u062.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999639/IMG_7281_samx29.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999639/IMG_7280_h8fxf8.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999639/IMG_7276_nwhcq3.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999637/IMG_7271_c9t7x3.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999638/IMG_7275_ljlcek.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999633/IMG_7270_eukzw7.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999631/IMG_7267_vvttvy.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999632/IMG_7269_v5mque.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999630/IMG_7262_ldzl4e.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999626/IMG_7257_pc3yw1.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999625/IMG_7254_ial9x5.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999624/IMG_7245_zhf3xp.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999624/IMG_7240_h0ntaw.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999624/IMG_7238_yblq82.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999623/IMG_7237_h9rgbu.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999619/IMG_7230_ixnnez.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999620/IMG_7232_ohpx5z.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999619/IMG_7223_maarhu.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999619/IMG_7222_vj8ezg.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999618/IMG_7220_qquvp9.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999596/IMG_7208_opgw3s.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999596/IMG_7216_c583wd.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999595/IMG_7197_hclsa8.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999596/IMG_7217_tkehwl.jpg",
            "https://res.cloudinary.com/oy7u6ywg/image/upload/v1784999596/IMG_7219_v6jcnx.jpg"
        ];

        const grid = document.getElementById('galleryGrid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxClose = document.getElementById('lightboxClose');
        const lightboxPrev = document.getElementById('lightboxPrev');
        const lightboxNext = document.getElementById('lightboxNext');
        const lightboxCounter = document.getElementById('lightboxCounter');

        let currentIndex = 0;

        exactUrls.forEach((url, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `<img src="${url}" alt="Ảnh mùa xuân ${index + 1}" loading="lazy">`;
            item.addEventListener('click', () => openLightbox(index));
            grid.appendChild(item);
        });

        function openLightbox(index) {
            currentIndex = index;
            updateLightboxImage();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function updateLightboxImage() {
            lightboxImg.src = exactUrls[currentIndex];
            lightboxCounter.textContent = `${currentIndex + 1} / ${exactUrls.length}`;
        }

        function showPrev(e) {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + exactUrls.length) % exactUrls.length;
            updateLightboxImage();
        }

        function showNext(e) {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % exactUrls.length;
            updateLightboxImage();
        }

        lightboxClose.addEventListener('click', closeLightbox);
        lightboxPrev.addEventListener('click', showPrev);
        lightboxNext.addEventListener('click', showNext);

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') {
                currentIndex = (currentIndex - 1 + exactUrls.length) % exactUrls.length;
                updateLightboxImage();
            }
            if (e.key === 'ArrowRight') {
                currentIndex = (currentIndex + 1) % exactUrls.length;
                updateLightboxImage();
            }
        });
    </script>
</body>
</html>
