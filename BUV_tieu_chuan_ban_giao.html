<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>G</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}body{height:100vh;display:flex;flex-direction:column;font-family:sans-serif;overflow:hidden}
  .main{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .cnt{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;padding:4px 8px;font-size:11px;border-radius:3px;z-index:10}
  #w{width:100%;height:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  #w img{position:absolute;width:100%;height:100%;object-fit:cover;transform-origin:center}
  .ctrl{position:absolute;bottom:10px;right:10px;background:rgba(255,255,255,.9);padding:3px 8px;border-radius:15px;display:flex;gap:6px;align-items:center;z-index:500;box-shadow:0 2px 5px rgba(0,0,0,.1)}
  .ctrl input{width:60px;cursor:pointer}.brand{font-size:10px;color:#666;border-left:1px solid #ccc;padding-left:6px}
  .rail{height:90px;background:#e4e4e4;border-top:1px solid #ccc;display:flex;align-items:center;overflow-x:auto;gap:8px;padding:0 10px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}.thumb{width:70px;height:70px;flex-shrink:0;border:2px solid transparent;cursor:pointer;overflow:hidden;border-radius:2px}
  .thumb.active{border-color:#000}.thumb img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="main">
  <div class="cnt" id="c">1/10</div>
  <div id="w"></div>
  <div class="ctrl">
    <input type="range" id="s" min="1" max="5" step="0.05" value="1">
    <div class="brand">dulieunhapho.com</div>
  </div>
</div>
<div class="rail" id="r"></div>
<script>
  const d=['https://bcons.vn/wp-content/uploads/2025/10/bcons-uni-valley-2.jpg','https://res.cloudinary.com/oy7u6ywg/image/upload/v1784480318/d4973c98-8f80-46ac-8dc0-2099b1f22966.png','https://res.cloudinary.com/oy7u6ywg/image/upload/v1784480297/59368873-c708-449b-a10d-6331ca5f3d61.png','https://res.cloudinary.com/oy7u6ywg/image/upload/v1784480269/4c6a017f-448a-466c-a831-6160104792d7.png','https://res.cloudinary.com/oy7u6ywg/image/upload/v1784480241/e0e63a19-c2b6-423d-9761-4cec7586c5f4.png','https://res.cloudinary.com/oy7u6ywg/image/upload/v1783702557/aea236f0-cc0e-4ca2-afab-e4fb3c07be35.png','https://res.cloudinary.com/oy7u6ywg/image/upload/v1783703625/836a441d-2840-4eba-916b-ef6aa3a0a7eb.png','https://res.cloudinary.com/oy7u6ywg/image/upload/v1783704676/0a1ea893-ba4c-4d18-a3aa-3dfd768d9e09.png','https://bcons.vn/wp-content/uploads/2025/10/bcons-uni-valley-8.jpg','https://bcons.vn/wp-content/uploads/2025/10/bcons-uni-valley-9.jpg'];
  let i=0,sc=1,x=0,y=0,dg=0,sx=0,sy=0,px=0,py=0;
  const w=document.getElementById('w'),s=document.getElementById('s'),r=document.getElementById('r');
  function u(){w.innerHTML=`<img src="${d[i]}" style="transform:translate(${x}px,${y}px) scale(${sc})">`;c.innerText=`${i+1}/${d.length}`;document.querySelectorAll('.thumb').forEach((t,k)=>t.classList.toggle('active',k===i))}
  function z(){sc=1;x=0;y=0;s.value=1;u()}
  d.forEach((u,k)=>{const t=document.createElement('div');t.className=`thumb ${k===0?'active':''}`;t.innerHTML=`<img src="${u}">`;t.onclick=()=>{i=k;z()};r.appendChild(t)});
  s.oninput=e=>{let p=sc;sc=+e.target.value;x*=sc/p;y*=sc/p;u()};
  w.onwheel=e=>{e.preventDefault();let p=sc;sc=Math.min(5,Math.max(1,sc+(e.deltaY<0?.25:-.25)));x*=sc/p;y*=sc/p;if(sc===1)x=y=0;s.value=sc;u()};
  w.onmousedown=e=>{if(sc>1){dg=1;sx=e.clientX;sy=e.clientY;px=x;py=y}};
  window.onmousemove=e=>{if(!dg)return;x=px+(e.clientX-sx);y=py+(e.clientY-sy);u()};
  window.onmouseup=()=>dg=0;u();
</script>
</body>
</html>
